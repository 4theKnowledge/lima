[project]
name = "lima"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "exactextract>=0.3.0",
    "fastapi>=0.115.0",
    "geopandas>=1.1.4",
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "netcdf4>=1.7.4",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rioxarray>=0.19.0",
    "ruamel-yaml>=0.19.1",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
