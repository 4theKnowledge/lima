# All scoring tunables live here. Nothing hardcoded in scoring code.
# See BUILD_BRIEF.md §6 for rationale.

# Stage 1 — hard mask. A cell is excluded outright if ANY of these hold.
# The reason is stored in hex.exclusion_reasons; excluded cells stay in the table.
exclusions:
  gsr_mean_mm_below: 500
  capability_class_at_or_above: 6
  slope_mean_pct_above: 20
  parcel_count_below: 1
  # Coarse proxy for water register allocation status — see §6.
  # Set to false to disable, true to exclude cells in proclaimed GW areas.
  exclude_if_gw_proclaimed: false
  # Groundwater salinity (DWER-026, mapped in ingest/salinity.py:TDS_ORDER):
  #   1 = <500 mg/L (fresh)      4 = 3000-7000 (brackish, limited crops)
  #   2 = 500-1000 (marginal)    5 = 7000-14000 (saline)
  #   3 = 1000-3000 (brackish)   6 = 14000-35000 (very saline, ~seawater)
  #                              7 = >35000 (hypersaline)
  # Default 5 excludes cells with saline groundwater and worse — usable water
  # supply becomes the binding constraint for most rural enterprises.
  # Set to 8 to disable.
  salinity_idx_at_or_above: 3
  # DBCA estate fraction. Cells more than X fraction inside national parks /
  # state forests / nature reserves have effectively no buyable land.
  # Default 0.9 excludes cells that are ≥90% DBCA. Set to 1.1 to disable.
  dbca_estate_frac_above: 0.95
  # Summer max temp (°C, Dec-Feb mean daily max, 1991-2020 baseline).
  # Excludes cells with mean summer max at or above X — heat stress on stock,
  # crops and humans. Default 40 sits above every SW/wheatbelt cell (i.e.
  # disabled). Drop to ~34 to target very hot inland cells for a temperate
  # Purpose (Denmark hobby block, vineyard).
  summer_max_temp_c_above: 40
  # Winter min temp (°C, Jun-Aug mean daily min, 1991-2020 baseline).
  # Excludes cells with mean winter min at or below X — frost-sensitive
  # enterprises (avocado, citrus) hate real cold. Default -10 disables (no
  # SW cell hits that). Set to ~4 for a frost-averse hobby/citrus Purpose.
  winter_min_temp_c_below: -10
  # Population density (persons/km², ABS 2021 Census SA1 area-weighted).
  # Excludes cells above X people/km² — targets broadacre/off-grid Purposes
  # that want to avoid urban encroachment or peri-urban land-use conflict.
  # SW rural cells sit ~0.1-5 /km²; townsites push into the tens or hundreds.
  # Default 10000 disables (metro Perth hits ~4000). Try 20 for broadacre,
  # 5 for genuine off-grid.
  pop_density_per_km2_above: 10000

# Stage 2 — weighted sum on survivors. Weights must sum to 1.0.
# Renormalised from the original 5-factor defaults when `scale` was added
# — kept broad shape (water/rainfall lead, soil next, access/bushfire lower).
# Scale carves out a middle slot because it's meaningfully purpose-defining
# but not primary evidence like water or rainfall.
weights:
  water: 0.18
  rainfall: 0.2
  soil: 0.08
  access: 0.18
  bushfire: 0.2
  scale: 0.16

# Breakpoint curves. Each is a list of [input, score] pairs; scores between
# breakpoints are linearly interpolated. Use these to encode real-world
# thresholds instead of naive linear scaling.

curves:
  # Growing-season rainfall (mm). Cliff below ~400mm, indifferent above ~600mm.
  rainfall_level:
    - [300, 0.00]
    - [400, 0.20]
    - [500, 0.70]
    - [600, 0.95]
    - [800, 1.00]

  # Distance to sealed road (km). 2km and 8km are similar; 8km and 40km are not.
  access_road:
    - [0, 1.00]
    - [2, 0.95]
    - [8, 0.80]
    - [20, 0.40]
    - [40, 0.10]
    - [80, 0.00]

  # Distance to nearest townsite (km). Very close is fine; very far is not.
  access_townsite:
    - [0, 1.00]
    - [15, 0.90]
    - [40, 0.60]
    - [80, 0.25]
    - [150, 0.00]

  # Soil capability class 1 (best) .. 6 (worst). DPIRD uses A1..C2 ratings
  # mapped in ingest/soils.py:CLASS_ORDER as 1..6. Modal class within the cell.
  soil_capability:
    - [1, 1.00]   # A1 — very high capability, few limitations
    - [2, 0.85]   # A2
    - [3, 0.65]   # B1 — moderate limitations (most SW rural land)
    - [4, 0.40]   # B2
    - [5, 0.15]   # C1 — high limitations
    - [6, 0.00]   # C2 — very high limitations, effectively unusable

  # Bushfire prone area fraction (0..1). Inverse relationship.
  bushfire_inverse:
    - [0.0, 1.00]
    - [0.3, 0.80]
    - [0.7, 0.40]
    - [1.0, 0.15]

  # Parcel scale — how well the cell's MEDIAN parcel size matches the intent.
  # Two named curves; Purposes pick which one is active via `scale_curve`.
  #
  # Broadacre wants big blocks. Cells full of 500 ha+ parcels score max;
  # townsite subdivisions score minimum.
  scale_broadacre:
    - [0.5, 0.10]     # townsite subdivision
    - [10, 0.30]      # small farm / hobby
    - [50, 0.70]
    - [200, 0.95]
    - [500, 1.00]
    - [5000, 1.00]

  # Hobby / off-grid wants 1-10 ha blocks. Penalises townsite subdivision
  # (too small) AND big broadacre blocks (would need subdividing — wrong
  # shire for that). Peak at ~5 ha, gentle roll-off either side.
  scale_hobby:
    - [0.2, 0.00]     # townsite subdivision, not a lifestyle block
    - [1, 0.60]
    - [2, 0.90]
    - [5, 1.00]       # ideal
    - [10, 0.90]
    - [20, 0.75]
    - [50, 0.45]
    - [100, 0.25]     # too big for a hobby block
    - [500, 0.10]

# Default scale curve. Purpose bundles override this by name; edit here to
# change the standalone default (i.e. when no Purpose is active).
scale_curve: scale_hobby

# Rainfall trend (mm/decade since 1970). Negative values = declining.
# Penalty is applied as a MULTIPLIER on the rainfall_level score.
# See §6: "treat steeper decline as a penalty on the level score, not a
# separate additive term."
rainfall_trend_penalty:
  # [trend_mm_per_decade, multiplier]
  - [-40, 0.60]
  - [-20, 0.80]
  - [-10, 0.95]
  - [0, 1.00]
  - [20, 1.05]    # capped in scoring code so total score cannot exceed 1.0

# Water sub-score. In the MVP the only signal is gw_proclaimed (per §6, the
# Water Register has no bulk API; allocation status is a Tier 2 manual loader).
water_score:
  unproclaimed: 1.00
  proclaimed_no_headroom: 0.00      # unreachable in MVP; requires manual loader
  proclaimed_unknown_headroom: 0.50   # what we can actually assign in MVP

# Residual layer (M8): join price_locality to hex; grey out sparse localities.
residual:
  min_n_sales: 5

# H3 aggregation
h3:
  resolution: 7   # ~5 km² per cell; res 8 (~0.75 km²) requires UI changes

# Parcel filters applied at ingest. Order matters — drop counts are reported
# per-filter against the pre-filter population at each step.
parcel_filters:
  min_area_ha: 10
  drop_townsite_intersect: true
  drop_crown_reserves: true
  drop_dbca_estate: true
  drop_perth_metro_lgas: true
